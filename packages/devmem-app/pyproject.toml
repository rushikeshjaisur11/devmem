[project]
name = "devmem-app"
version = "0.1.0"
description = "Indexer, graph and (later) publisher/UI for devmem."
requires-python = ">=3.10"
dependencies = [
  "devmem",
  "sqlglot>=25", "fastapi>=0.110", "uvicorn>=0.29",
  # accuracy is not optional: these are always installed and always used
  "graphifyy",                                                              # tree-sitter call graph, cross-checks our edges
  "tree-sitter>=0.22", "tree-sitter-javascript>=0.21", "tree-sitter-typescript>=0.21",   # JS/TS parsing
  "tree-sitter-go>=0.23", "tree-sitter-java>=0.23",                                       # Go/Java parsing
  "ruff", "vulture", "radon", "deptry", "bandit", "sqlfluff",               # hygiene reports
]

[tool.uv.sources]
devmem = { workspace = true }

[project.optional-dependencies]
test = ["httpx", "pytest"]

[project.scripts]
devmem-app = "devmem_app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devmem_app = ["ui_dist/**/*"]
